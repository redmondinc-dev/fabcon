# Build the site and publish it to GitHub Pages.
# The repository setting "Pages > Build and deployment > Source" must be "GitHub Actions".
name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A new push waits for the deployment that is in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The build runs the checks first. It stops on an unknown claim or source,
      # a message that is too long, or a tracked path under private/.
      - run: npm run build
      # The preflight stops the deployment on a media file, an email address, a local path
      # or a private term in the tracked files or in dist/.
      - run: node scripts/preflight
        env:
          PREFLIGHT_TERMS: ${{ secrets.PREFLIGHT_TERMS }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
